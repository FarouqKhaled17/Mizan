version: 2.1

jobs:
  build:
    docker:
      - image: cimg/openjdk:17.0
    working_directory: ~/project
    steps:
      - checkout

      - setup_remote_docker:
          docker_layer_caching: true

      - run:
          name: Build Maven project
          command: mvn clean package -DskipTests=false

      - run:
          name: Run tests
          command: mvn test

      - run:
          name: Build Docker image
          command: |
            docker build -t mizan-app:latest .

      - run:
          name: Run Docker container
          command: |
            docker run -d -p 8080:8080 --name mizan-app mizan-app:latest

workflows:
  version: 2
  build_and_test:
    jobs:
      - build
